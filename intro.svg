<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="그때의 나에게">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeeff2"/>
      <stop offset="1" stop-color="#f6f6f7"/>
    </linearGradient>
    <linearGradient id="mend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b727e" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#6b727e" stop-opacity="1"/>
      <stop offset="1" stop-color="#6b727e" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.74" r="0.42">
      <stop offset="0" stop-color="#6b727e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6b727e" stop-opacity="0"/>
