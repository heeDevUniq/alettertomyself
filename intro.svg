  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <text x="600" y="106" font-size="16" letter-spacing="7" fill="#9ca1aa">A LETTER TO MYSELF</text>
    <text x="600" y="190" font-size="60" font-weight="700" fill="#262a32">그때의 나에게</text>
    <text x="600" y="238" font-size="20" fill="#5a6270">지워지지 않아도, 아물 수는 있습니다</text>
